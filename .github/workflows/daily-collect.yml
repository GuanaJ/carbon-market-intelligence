name: Daily carbon market collection

on:
  schedule:
    # GitHub cron uses UTC: 09:30 UTC = 17:30 Beijing time.
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect verified public data
        run: npm run collect:pages
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- public/data/latest-market.json; then
            echo "No verified update"
            exit 0
          fi
          git config user.name "carbon-data-bot"
          git config user.email "carbon-data-bot@users.noreply.github.com"
          git add -- public/data/latest-market.json
          git commit -m "data: refresh verified market snapshot"
          git push
