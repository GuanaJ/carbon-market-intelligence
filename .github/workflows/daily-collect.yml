name: Daily carbon market collection

on:
  schedule:
    # GitHub cron uses UTC: 09:30 UTC = 17:30 Beijing time.
    - cron: "30 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  collect:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Collect verified public data
        run: npm run collect:pages
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- public/data/latest-market.json public/data/platform-snapshot.json public/data/collection-log.json public/data/records-db.json public/data/market-history.json; then
            echo "No verified update"
          else
            git config user.name "carbon-data-bot"
            git config user.email "carbon-data-bot@users.noreply.github.com"
            git add -- public/data/latest-market.json public/data/platform-snapshot.json public/data/collection-log.json public/data/records-db.json public/data/market-history.json
            git commit -m "data: refresh all-module snapshot"
            git push
          fi
      - name: Build refreshed site
        run: npm run build:pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
